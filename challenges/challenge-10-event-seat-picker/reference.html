<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference — Seat Picker</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#191625;color:#fff;margin:0;padding:30px}.wrap{max-width:680px;margin:auto}.stage{text-align:center;border:1px solid #8176bd;border-radius:50% 50% 8px 8px;padding:11px;letter-spacing:.18em;font-size:11px}.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:36px 0}.seat{aspect-ratio:1;border:0;border-radius:9px;background:#f3efff;color:#201a42;cursor:pointer}.seat[aria-pressed=true]{background:#ffcf5c}.seat:disabled{background:#4b465b;color:#aaa}.bar{display:flex;justify-content:space-between;background:#fff;color:#1e1a31;padding:16px;border-radius:14px}.bar button{background:#6e55e8;color:white;border:0;border-radius:8px;padding:10px}</style><main class="wrap"><p>MOONLIGHT HALL · 8:30 PM</p><h1>Select your seats</h1><div class="stage">STAGE</div><div class="seats" id="seats" role="group" aria-label="Seat map, $28 each"></div><div class="bar"><span id="summary" aria-live="polite"></span><button id="go">Continue — $0</button></div></main><script>var taken=[3,8,14,19],chosen=[],box=seats;function draw(){box.innerHTML='';for(var i=1;i<25;i++){var b=document.createElement('button'),off=taken.includes(i),on=chosen.includes(i);b.className='seat';b.textContent=i;b.disabled=off;b.setAttribute('aria-pressed',on);b.setAttribute('aria-label','Seat '+i+(off?', unavailable':on?', selected':', available'));b.onclick=(function(n){return function(){if(chosen.includes(n))chosen.splice(chosen.indexOf(n),1);else if(chosen.length<4)chosen.push(n);else{summary.textContent='You can select at most four seats.';return}draw()}})(i);box.appendChild(b)}summary.textContent=chosen.length?chosen.length+' seats selected: '+chosen.join(', '):'Choose up to 4 seats';go.textContent='Continue — $'+chosen.length*28}draw()</script>
