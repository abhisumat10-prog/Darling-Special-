<!doctype html><meta charset="utf-8"><title>Reference — Upload</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#f5f7fb;padding:40px}.card{max-width:620px;margin:auto;background:#fff;padding:28px;border-radius:20px}.drop{border:2px dashed #7a68e8;border-radius:16px;padding:45px;text-align:center}.drop.over{background:#f0edff}.row{margin:12px 0;padding:12px;background:#f7f7fb;border-radius:10px}.bar{height:6px;background:#ddd;border-radius:5px}.bar i{display:block;height:100%;background:#6d56e8;border-radius:5px}button{cursor:pointer}</style><main class="card"><h1>Upload project files</h1><div class="drop" id="drop">Drop PNG, JPG or PDF files here<br><button id="browse">Browse files</button><input id="file" type="file" hidden multiple accept=".png,.jpg,.jpeg,.pdf"></div><p id="message" aria-live="polite"></p><div id="files"></div></main><script>var allowed=['image/png','image/jpeg','application/pdf'];browse.onclick=function(){file.click()};function add(fs){[...fs].forEach(function(x){if(!allowed.includes(x.type)||x.size>5e6){message.textContent=x.name+' is not a supported file under 5MB.';return}var row=document.createElement('div');row.className='row';row.innerHTML='<b>'+x.name+'</b> <button>Remove</button><div class="bar"><i style="width:0%"></i></div>';files.appendChild(row);row.querySelector('button').onclick=function(){row.remove()};var p=0,t=setInterval(function(){p+=10;row.querySelector('i').style.width=p+'%';if(p>=100){clearInterval(t);message.textContent=x.name+' uploaded.'}},80)})}file.onchange=function(){add(file.files)};['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(x){x.preventDefault();drop.classList.add('over')})});['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(x){x.preventDefault();drop.classList.remove('over')})});drop.ondrop=function(e){add(e.dataTransfer.files)}</script>
