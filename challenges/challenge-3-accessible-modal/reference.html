<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge 3 - Reference: Accessible Modal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    /* Modal Card */
    .modal-dialog {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      transition: background-color 0.15s, color 0.15s;
    }

    .close-btn:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .close-btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-wrapper svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .header-content {
      padding-top: 2px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
    }

    .btn:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <!-- Modal Overlay -->
  <div class="modal-backdrop" id="backdrop">
    <div 
      class="modal-dialog" 
      role="dialog" 
      aria-modal="true" 
      aria-labelledby="modalTitle" 
      aria-describedby="modalDesc"
    >
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-header">
        <div class="icon-wrapper" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="header-content">
          <h2 class="modal-title" id="modalTitle">Deactivate Team Account</h2>
          <p class="modal-desc" id="modalDesc">
            Are you sure you want to deactivate your team workspace? All member access will be revoked and scheduled jobs will be suspended immediately.
          </p>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmBtn">Yes, Deactivate</button>
      </div>
    </div>
  </div>

  <script>
    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('closeBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    function dismissModal() {
      backdrop.style.display = 'none';
    }

    closeBtn.addEventListener('click', dismissModal);
    cancelBtn.addEventListener('click', dismissModal);

    // Escape key listener for WCAG 2.1 modal dismiss requirement
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        dismissModal();
      }
    });
  </script>
</body>
</html>
