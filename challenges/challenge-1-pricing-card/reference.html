<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge 1 - Reference: Pricing Tier Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      padding: 24px;
    }

    .pricing-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .pricing-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .plan-name {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.02em;
    }

    .plan-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .price-wrapper {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 28px;
    }

    .currency {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }

    .price {
      font-size: 44px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1;
    }

    .period {
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #334155;
    }

    .check-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ecfdf5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-icon svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .btn-cta {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .btn-cta:hover {
      background: #1d4ed8;
    }

    .btn-cta:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }
      .pricing-card {
        padding: 24px;
      }
      .price {
        font-size: 38px;
      }
    }
  </style>
</head>
<body>
  <article class="pricing-card" aria-label="Pro tier pricing details">
    <header class="card-header">
      <h3 class="plan-name">Pro Tier</h3>
      <span class="badge">Most Popular</span>
    </header>
    <p class="plan-desc">Perfect for ambitious frontend teams building design systems at scale.</p>

    <div class="price-wrapper">
      <span class="currency">$</span>
      <span class="price">49</span>
      <span class="period">/ user / month</span>
    </div>

    <ul class="feature-list">
      <li class="feature-item">
        <span class="check-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Unlimited component playgrounds</span>
      </li>
      <li class="feature-item">
        <span class="check-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Automated axe-core a11y scoring</span>
      </li>
      <li class="feature-item">
        <span class="check-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Pixelmatch visual regression tests</span>
      </li>
      <li class="feature-item">
        <span class="check-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Claude 3.5 Sonnet code-craft reviews</span>
      </li>
    </ul>

    <button type="button" class="btn-cta">Start 14-day Free Trial</button>
  </article>
</body>
</html>
