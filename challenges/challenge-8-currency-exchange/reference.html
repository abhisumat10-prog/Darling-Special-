<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference — Exchange</title><style>*{box-sizing:border-box}body{font:16px Arial;background:linear-gradient(135deg,#e9edff,#d9fff5);margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(440px,92vw);background:white;padding:30px;border-radius:24px;box-shadow:0 20px 50px #3452a333}.row{display:grid;grid-template-columns:1fr 90px;gap:9px}input,select,button{width:100%;padding:13px;border:1px solid #d5d9ed;border-radius:10px;font:inherit}.swap{width:auto;display:block;margin:12px auto;background:#635bff;color:#fff}.quote{background:#f4f5ff;padding:12px;border-radius:10px}.error{color:#b42318;min-height:20px}</style><main class="card"><b>JETSET / QUICK QUOTE</b><h1>Exchange money</h1><div class="row"><input id="amount" value="100" inputmode="decimal" aria-describedby="message"><select id="from"><option>USD</option><option>EUR</option><option>INR</option><option>JPY</option></select></div><button class="swap" id="swap" aria-label="Swap currencies">⇅ Swap</button><div class="row"><input id="result" readonly aria-label="Recipient amount"><select id="to"><option>EUR</option><option>USD</option><option>INR</option><option>JPY</option></select></div><p id="message" class="error" aria-live="polite"></p><p id="details" class="quote"></p></main><script>var rates={USD:1,EUR:.92,INR:83.1,JPY:151.7},a=amount,f=from,t=to,r=result,m=message,d=details;function q(){var n=Number(a.value);if(!n||n<0){m.textContent='Enter an amount greater than zero.';r.value='';return}m.textContent='Fetching quote…';setTimeout(function(){var raw=n/rates[f.value]*rates[t.value],fee=raw*.015;r.value=(raw-fee).toFixed(2);m.textContent='Quote ready';d.textContent='1 '+f.value+' = '+(rates[t.value]/rates[f.value]).toFixed(4)+' '+t.value+' · Fee '+fee.toFixed(2)},350)}[a,f,t].forEach(function(x){x.oninput=q;x.onchange=q});swap.onclick=function(){var x=f.value;f.value=t.value;t.value=x;q()};q()</script>
