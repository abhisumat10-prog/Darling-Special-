<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference — Bento Profile</title><style>:root{--ink:#171717;--paper:#f7f5f1;--card:#fff;--lime:#c9ff37}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:500 16px Arial}main{max-width:1120px;margin:auto;padding:28px}.eyebrow{font:700 12px monospace;letter-spacing:.1em}.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:185px;gap:16px;margin-top:22px}.card{border:1.5px solid var(--ink);border-radius:24px;background:var(--card);padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s}.card:hover{transform:translateY(-4px)}.intro{grid-column:span 2;grid-row:span 2;background:var(--lime)}.intro h1{font-size:clamp(2rem,4vw,4.2rem);line-height:.94;margin:24px 0}.work{grid-column:span 2;background:#201f25;color:#fff}.work strong{font-size:2rem}.stat{justify-content:center}.stat b{font-size:4rem}.notes{grid-column:span 2}button,a{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:10px 14px;color:inherit;font-weight:700;text-decoration:none;width:max-content}button:focus-visible,a:focus-visible{outline:3px solid #3565ff;outline-offset:3px}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.intro,.work{grid-column:span 2}}@media(max-width:500px){main{padding:16px}.grid{display:block}.card{min-height:160px;margin-bottom:12px}.intro h1{font-size:2.8rem}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}</style></head><body><main><div class="eyebrow">RHEA LEE / TYPE & IDENTITY</div><section class="grid"><article class="card intro"><span>● AVAILABLE FOR SELECT WORK</span><h1>Type systems with a human pulse.</h1><button id="copy">Copy email</button></article><article class="card work"><span>FEATURED FAMILY</span><strong>Glyph Garden ↗</strong><span>Variable display type · 2026</span></article><article class="card stat"><b>12</b><span>typefaces released</span></article><article class="card stat"><b>04</b><span>countries collaborated with</span></article><article class="card notes"><span>FROM THE STUDIO</span><a href="#notes">Read the field notes →</a></article></section></main><script>var b=document.getElementById('copy');b.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText('hello@rhea.studio');b.textContent='Email copied';setTimeout(function(){b.textContent='Copy email'},1500)}</script></body></html>
