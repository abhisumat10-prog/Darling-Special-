<!doctype html><meta charset="utf-8"><title>Reference — Kanban</title><style>*{box-sizing:border-box}body{font:16px Arial;background:#f3f5f9;margin:0;padding:28px}.board{display:flex;gap:16px;overflow:auto}.col{background:#e8ebf1;padding:14px;border-radius:14px;min-width:270px;flex:1}.task{background:#fff;padding:14px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #0001;cursor:grab}.task small{display:block;color:#667085;margin-top:8px}.col.over{outline:2px solid #6c63ff}@media(max-width:700px){.board{padding-bottom:16px}}</style><h1>Orbit board</h1><main class="board"><section class="col" data-col="todo"><h2>To do <span></span></h2></section><section class="col" data-col="doing"><h2>Doing <span></span></h2></section><section class="col" data-col="done"><h2>Done <span></span></h2></section></main><script>var tasks=JSON.parse(localStorage.orbitTasks||'[{"id":1,"title":"Interview three users","col":"todo"},{"id":2,"title":"Sketch onboarding","col":"doing"},{"id":3,"title":"Ship release notes","col":"done"}]'),drag;function save(){localStorage.orbitTasks=JSON.stringify(tasks)}function draw(){document.querySelectorAll('.col').forEach(function(c){c.querySelectorAll('.task').forEach(function(x){x.remove()});var list=tasks.filter(function(t){return t.col===c.dataset.col});c.querySelector('span').textContent=list.length;list.forEach(function(t){var x=document.createElement('article');x.className='task';x.draggable=true;x.textContent=t.title;x.innerHTML+='<small>Drag or drop into another column</small>';x.ondragstart=function(){drag=t.id};c.appendChild(x)})})}document.querySelectorAll('.col').forEach(function(c){c.ondragover=function(e){e.preventDefault();c.classList.add('over')};c.ondragleave=function(){c.classList.remove('over')};c.ondrop=function(){var t=tasks.find(function(x){return x.id===drag});t.col=c.dataset.col;save();draw()}});draw()</script>
