<!doctype html><meta charset="utf-8"><title>Reference — Telemetry</title><style>body{font:16px Arial;background:#0d1120;color:#eef3ff;margin:0;padding:32px}.card{max-width:850px;margin:auto;background:#171d31;padding:24px;border-radius:18px}button{background:#293250;color:white;border:1px solid #52618b;padding:9px;border-radius:7px}button.active{background:#75e6bb;color:#092219}svg{width:100%;height:auto;background:#11172a;border-radius:12px;margin-top:18px}.dot{fill:#fff;stroke:#75e6bb;stroke-width:4;cursor:pointer}</style><main class="card"><p>HOME BATTERY / LIVE</p><h1>Energy telemetry</h1><div id="tabs"></div><svg id="chart" viewBox="0 0 600 240" role="img" aria-label="Hourly household energy consumption and solar output"></svg><p id="summary" aria-live="polite">Select a point for details.</p><p>Solid line: consumption. Dashed line: solar generation.</p></main><script>var data=[4,6,5,8,12,10,16,14,19,15],tabs=['24h','7d','30d'];tabs.forEach(function(x,i){var b=document.createElement('button');b.textContent=x;b.className=i?'':'active';b.onclick=function(){document.querySelectorAll('button').forEach(function(z){z.className=''});b.className='active';summary.textContent=x+' view selected'};tabsEl=tabs});var w=540,h=170,svg=chart;function pts(mult){return data.map(function(v,i){return [30+i*w/9,210-v*mult]})}function path(a){return a.map(function(p,i){return(i?'L':'M')+p[0]+' '+p[1]}).join(' ')}svg.innerHTML='<path d="'+path(pts(8))+'" fill="none" stroke="#75e6bb" stroke-width="4"/><path d="'+path(pts(4))+'" fill="none" stroke="#a996ff" stroke-width="3" stroke-dasharray="7 6"/>';pts(8).forEach(function(p,i){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','dot');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',6);c.setAttribute('tabindex',0);c.setAttribute('aria-label','Hour '+(i+1)+', '+data[i]+' kilowatt hours');c.onclick=function(){summary.textContent='Hour '+(i+1)+': '+data[i]+' kWh consumed; '+Math.round(data[i]/2)+' kWh solar'};svg.appendChild(c)})</script>
