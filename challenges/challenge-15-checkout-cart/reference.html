<!doctype html><meta charset="utf-8"><title>Reference — Checkout</title><style>body{font:16px Arial;background:#f8f6f1;padding:30px}.card{max-width:700px;margin:auto;background:white;padding:24px;border-radius:16px}.item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #ddd}.qty button{padding:6px 10px}.total{background:#f3f0e9;padding:14px;border-radius:10px}input,button{padding:9px}</style><main class="card"><h1>Your cart</h1><div id="items"></div><input id="code" placeholder="Discount code"><button id="apply">Apply</button><div id="total" class="total"></div><p id="message" aria-live="polite"></p></main><script>var cart=[{id:1,name:'Cedar desk lamp',price:64,qty:1},{id:2,name:'Linen cable ties',price:14,qty:2}],discount=0;function draw(){items.innerHTML='';cart.forEach(function(x){var e=document.createElement('div');e.className='item';e.innerHTML='<span><b>'+x.name+'</b><br>$'+x.price+'</span><span class="qty"><button>−</button> '+x.qty+' <button>+</button> <button>Remove</button></span>';var b=e.querySelectorAll('button');b[0].onclick=function(){change(x,-1)};b[1].onclick=function(){change(x,1)};b[2].onclick=function(){cart=cart.filter(function(z){return z!==x});message.textContent=x.name+' removed. Refresh to undo.';draw()};items.appendChild(e)});var sub=cart.reduce(function(s,x){return s+x.price*x.qty},0),off=sub*discount,tax=(sub-off)*.08;total.textContent='Subtotal $'+sub.toFixed(2)+' · Discount −$'+off.toFixed(2)+' · Tax $'+tax.toFixed(2)+' · Total $'+(sub-off+tax).toFixed(2)}function change(x,n){var old=x.qty;x.qty=Math.max(1,old+n);draw();message.textContent='Updating '+x.name+'…';setTimeout(function(){if(x.qty===4){x.qty=old;message.textContent='Update failed. Quantity restored.';draw()}else message.textContent='Cart updated.'},350)}apply.onclick=function(){discount=code.value.toUpperCase()==='WELCOME10'?.1:0;message.textContent=discount?'10% discount applied.':'That code is not valid.';draw()};draw()</script>
