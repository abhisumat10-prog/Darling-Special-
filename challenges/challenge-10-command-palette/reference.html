<!doctype html><meta charset="utf-8"><title>Reference — Palette</title><style>body{font:16px Arial;background:#f4f3fa;margin:0;padding:45px}.shade{position:fixed;inset:0;background:#25213966;display:grid;place-items:start center;padding-top:16vh}.palette{width:min(620px,92vw);background:#fff;border-radius:18px;overflow:hidden}.search{width:100%;border:0;border-bottom:1px solid #eee;padding:18px;font-size:16px}.item{width:100%;border:0;background:#fff;text-align:left;padding:13px 16px;cursor:pointer}.item.active,.item:hover{background:#eeecff}.empty{padding:28px;text-align:center;color:#777}</style><p>Open launcher with Ctrl/Cmd + K.</p><div id="root"></div><p id="live" aria-live="polite"></p><script>var cmds=['Go to inbox','Open calendar','New note','New project','Toggle dark mode'],open=false,index=0;function render(){if(!open){root.innerHTML='';return}root.innerHTML='<div class="shade"><section class="palette" role="dialog" aria-modal="true" aria-label="Command palette"><input class="search" id="search" aria-label="Search commands" placeholder="Type a command"><div id="list"></div></section></div>';var input=search;function list(){var x=cmds.filter(function(c){return c.toLowerCase().includes(input.value.toLowerCase())});index=Math.max(0,Math.min(index,x.length-1));results.innerHTML=x.length?x.map(function(c,i){return '<button class="item '+(i===index?'active':'')+'">'+c+'</button>'}).join(''):'<div class="empty">No command found</div>';results.querySelectorAll('button').forEach(function(b,i){b.onclick=function(){live.textContent=x[i]+' executed';open=false;render()}});return x}input.oninput=function(){index=0;list()};input.onkeydown=function(e){var x=list();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();index=(index+(e.key==='ArrowDown'?1:-1)+x.length)%x.length;list()}if(e.key==='Enter'&&x[index]){live.textContent=x[index]+' executed';open=false;render()}};list();input.focus()}document.onkeydown=function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();open=true;render()}if(e.key==='Escape'){open=false;render()}}</script>
